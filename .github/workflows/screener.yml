name: screener

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy lxml html5lib beautifulsoup4

      - name: Self-test the maths before trusting a run
        run: python screener.py --self-test

      - name: Run the screener
        run: python screener.py

      - name: Commit the results
        run: |
          git config user.name  "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A output .cache
          if git diff --staged --quiet; then
            echo "Nothing changed - not committing."
          else
            git commit -m "screener run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
